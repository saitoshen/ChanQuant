name: build-desktop

# 手动触发，或打 v* 标签时自动构建并发布
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # 英文版 Windows runner 的控制台是 cp1252，脚本里的中文 print 会抛
    # UnicodeEncodeError（表现为「生成图标」步骤莫名失败）。强制 UTF-8 模式。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: TrendDesk-win64
            archive: dist/TrendDesk-win64.zip
          - os: macos-latest     # Apple Silicon（macos-14 起默认 arm64）
            label: macOS arm64
            artifact: TrendDesk-macos-arm64
            archive: dist/TrendDesk-macos-arm64.zip
          - os: macos-15-intel   # Intel；macos-13 已于 2025-12-04 退役
            label: macOS x64
            artifact: TrendDesk-macos-x64
            archive: dist/TrendDesk-macos-x64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # xgboost 的 macOS wheel 不打包 OpenMP 运行时，libxgboost.dylib 里写的是
      # @rpath/libomp.dylib + LC_RPATH=/usr/local/opt/libomp/lib（x64）或
      # /opt/homebrew/opt/libomp/lib（arm64）。macos-latest 镜像预装了 arm64 那份，
      # macos-15-intel 没有 x64 那份 —— 这就是 macOS x64 上 XGBoost 静默消失的原因。
      # 构建期必须有它（否则 import 就失败），运行期由 build.py 打进包内。
      - name: 安装 libomp（macOS 上 xgboost 的原生依赖）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libomp || brew upgrade libomp
          ls -l "$(brew --prefix libomp)/lib" || true

      # 打包前的探针。xgboost 的原生库是 ctypes 在运行时按路径加载的，
      # 「源码环境能 import」和「打包后能 import」是两件独立的事，分开查才定位得快。
      - name: 检查机器学习依赖（源码环境）
        run: |
          python -c "import platform,sys; print('平台:', platform.machine(), '| Python:', sys.version.split()[0])"
          python -c "from ttrade import mlmodels as ML; print('可用:', ML.diagnose())"
          python -c "import importlib.metadata as m; print('xgboost', m.version('xgboost'))"

      - name: 生成图标
        run: python packaging/make_icon.py

      - name: 打包
        run: python build.py

      - name: 自检（验证包内资源与 Qt 插件）
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/TrendDesk/TrendDesk.exe --selftest || { cat "$LOCALAPPDATA/TrendDesk/logs/selftest.log"; exit 1; }
            cat "$LOCALAPPDATA/TrendDesk/logs/selftest.log"
          else
            ./dist/TrendDesk.app/Contents/MacOS/TrendDesk --selftest || {
              cat "$HOME/Library/Application Support/TrendDesk/logs/selftest.log"; exit 1; }
            cat "$HOME/Library/Application Support/TrendDesk/logs/selftest.log"
          fi

      - name: 列出产物
        shell: bash
        run: ls -lh dist/ || dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true

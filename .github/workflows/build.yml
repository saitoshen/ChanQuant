name: build-desktop

# 手动触发，或打 v* 标签时自动构建并发布
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # macOS arm64 允许失败：它从 v3.7.4 起自检就稳定死在「构建主窗口（端到端）」，
    # 退出码 139，且与 PySide6 版本无关（6.12.0 / 6.11.3 都一样），x64 与 Windows
    # 用同一份代码同一个包都不崩 —— 说明是 arm64 单独的问题，还没定位。
    # 不设这个开关的话，一个平台的未知问题会把三个平台的包全扣住（Release 被
    # skip），已经因此连续 5 轮发不出包。**这是妥协，不是修复**：arm64 的 zip
    # 会缺，别再默默往上加 ignore。
    continue-on-error: ${{ matrix.allow_fail == true }}
    # 英文版 Windows runner 的控制台是 cp1252，脚本里的中文 print 会抛
    # UnicodeEncodeError（表现为「生成图标」步骤莫名失败）。强制 UTF-8 模式。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: ChanQuant-win64
            archive: dist/ChanQuant-win64.zip
            allow_fail: false
          - os: macos-latest     # Apple Silicon（macos-14 起默认 arm64）
            label: macOS arm64
            artifact: ChanQuant-macos-arm64
            archive: dist/ChanQuant-macos-arm64.zip
            allow_fail: true     # 见上面的注释：自检段错误未定位
          - os: macos-15-intel   # Intel；macos-13 已于 2025-12-04 退役
            label: macOS x64
            artifact: ChanQuant-macos-x64
            archive: dist/ChanQuant-macos-x64.zip
            allow_fail: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # 发版最容易忘的就是同步版本号：v1.0.1 那次打出来的包里还写着 1.0.0，
      # 装完在「关于」里看到的是错版本，而且要等用户反馈才知道。
      # tag 构建时先对一遍，不一致直接失败，比事后发补丁包便宜得多。
      - name: 校验版本号与 tag 一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          spec=$(grep -E '^VERSION = ' packaging/ChanQuant.spec | head -1 | sed -E 's/.*"(.*)".*/\1/')
          pkg=$(grep -E '^__version__ = ' ttrade/__init__.py | head -1 | sed -E 's/.*"(.*)".*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag  spec=$spec  ttrade=$pkg"
          if [ "$spec" != "$tag" ]; then
            echo "::error::packaging/ChanQuant.spec 里 VERSION=$spec，与 tag v$tag 不一致"
            exit 1
          fi
          if [ "$pkg" != "$tag" ]; then
            echo "::error::ttrade/__init__.py 里 __version__=$pkg，与 tag v$tag 不一致"
            exit 1
          fi
          echo "版本号一致：$tag"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # CTP 客户端是**可选依赖**：openctp-ctp 只有 Windows / Linux 的 wheel，
      # macOS 上装不了。所以单独一步、只装 Windows、失败也不拦构建 ——
      # 装不上就是包里没有 CTP（自检会照实报「未安装」），其余功能不受影响。
      # 写进 requirements.txt 会让 macOS 打包直接挂，那条路走不通。
      - name: 安装 CTP 客户端（可选）
        if: runner.os == 'Windows'
        continue-on-error: true
        run: python -m pip install openctp-ctp

      # xgboost 的 macOS wheel 不打包 OpenMP 运行时，libxgboost.dylib 里写的是
      # @rpath/libomp.dylib + LC_RPATH=/usr/local/opt/libomp/lib（x64）或
      # /opt/homebrew/opt/libomp/lib（arm64）。macos-latest 镜像预装了 arm64 那份，
      # macos-15-intel 没有 x64 那份 —— 这就是 macOS x64 上 XGBoost 静默消失的原因。
      # 构建期必须有它（否则 import 就失败），运行期由 build.py 打进包内。
      - name: 安装 libomp（macOS 上 xgboost 的原生依赖）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libomp || brew upgrade libomp
          ls -l "$(brew --prefix libomp)/lib" || true

      # 打包前的探针。xgboost 的原生库是 ctypes 在运行时按路径加载的，
      # 「源码环境能 import」和「打包后能 import」是两件独立的事，分开查才定位得快。
      - name: 检查机器学习依赖（源码环境）
        run: |
          python -c "import platform,sys; print('平台:', platform.machine(), '| Python:', sys.version.split()[0])"
          python -c "from ttrade import mlmodels as ML; print('可用:', ML.diagnose())"
          python -c "import importlib.metadata as m; print('xgboost', m.version('xgboost'))"

      - name: 生成图标
        run: python packaging/make_icon.py

      # 随包的天勤轻量库（287MB）不进 git —— GitHub 单文件上限 100MB。
      # 放在单独的「数据包」release 里（tag 形如 data-2026-10，由 make_lite_db.py
      # 生成后上传），构建时拉下来。拉不到就让构建失败：少这 287MB 的包看起来
      # 一切正常，只是 5m/1h 全空 —— 那种包不该发出去。
      - name: 取天勤轻量库
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data_tq
          gh release download data-2026-10 --pattern tq_lite.duckdb --dir data_tq --clobber
          ls -lh data_tq/tq_lite.duckdb

      - name: 打包
        run: python build.py

      - name: 自检（验证包内资源与 Qt 插件）
        shell: bash
        run: |
          # 失败时把 [FAIL] 那几行**发成 annotation**：job 日志要 API token 才能
          # 读，annotation 匿名就能读，排查打包环境独有的失败时这是唯一线索。
          #
          # 但只知道发 [FAIL] 是不够的。v3.7.4（2026-11-16）那次 Windows 与
          # macOS arm64 双双失败，而 annotation 里一条 [FAIL] 都没有 —— 真实原因
          # 是**自检跑完全绿、进程退出时 fail-fast**（0xC0000409），`||` 分支里
          # `cat` 的日志当然没有失败项，于是只剩 GitHub 自动加的
          # "Process completed with exit code 1"，谁也不知道该怎么办。
          # 所以这里把「退出码 / 日志是否存在 / 没有 [FAIL] 时的日志尾部」都发出来。
          emit_fail() {
            grep -m5 "\[FAIL\]" "$1" 2>/dev/null | while IFS= read -r l; do
              echo "::error title=selftest::${l}"
            done
          }
          emit_tail() {
            # 只发 8 行：GitHub 对每个 step 的 error annotation 有 **10 条**配额，
            # 超出的直接丢弃。原先发 30 行，结果保留下来的恰好是日志尾部**最前面**
            # 那 10 行 —— 真正想知道是「最后停在哪一项」，反而永远看不到。
            tail -n "${2:-8}" "$1" 2>/dev/null | while IFS= read -r l; do
              echo "::error title=${3:-selftest-tail}::${l}"
            done
          }
          run_selftest() {
            exe="$1"
            log="$2"
            crash="$(dirname "$log")/selftest_crash.txt"
            # GitHub 的 bash 默认 `set -e`，直接调用失败会立刻退出脚本，
            # 后面的诊断一行都跑不到 —— 用 if 包住，把退出码接过来
            if "$exe" --selftest; then
              rc=0
            else
              rc=$?
            fi
            echo "退出码=$(printf '0x%X' "$rc") ($rc)  日志=$log  存在=$([ -f "$log" ] && echo 是 || echo 否)"
            if [ "$rc" -eq 0 ]; then
              [ -f "$log" ] && cat "$log"
              return 0
            fi
            echo "::error title=selftest::自检失败，退出码 $rc"
            # 顺序很重要：每 step 只有 10 条 error annotation 配额，**先发最值钱的**。
            # 崩溃栈和「死在哪一项」这两样一旦被日志尾部挤掉，这一轮又白跑了
            # （v3.7.4~v3.7.6 三轮都是这么损失的）。
            prog="$(dirname "$log")/selftest_progress.txt"
            if [ -f "$prog" ] && [ -s "$prog" ]; then
              echo "::error title=selftest-died-at::$(tail -n 1 "$prog")"
            fi
            if [ -f "$crash" ] && [ -s "$crash" ]; then
              echo "----- 崩溃栈（selftest_crash.txt）-----"
              cat "$crash"
              emit_tail "$crash" 5 selftest-crash
            fi
            if [ -f "$log" ] && grep -q "\[FAIL\]" "$log"; then
              cat "$log"
              emit_fail "$log"
            elif [ -f "$log" ]; then
              echo "::error title=selftest::日志里没有 [FAIL] 行 —— 进程崩在中途或被信号打死，下面是日志尾部"
              emit_tail "$log" 3
            else
              echo "::error title=selftest::日志文件不存在（自检没跑完就没机会落盘）"
            fi
            return 1
          }
          if [ "$RUNNER_OS" = "Windows" ]; then
            run_selftest ./dist/ChanQuant/ChanQuant.exe \
              "$LOCALAPPDATA/ChanQuant/logs/selftest.log"
          else
            run_selftest ./dist/ChanQuant.app/Contents/MacOS/ChanQuant \
              "$HOME/Library/Application Support/ChanQuant/logs/selftest.log"
          fi

      - name: 列出产物
        shell: bash
        run: ls -lh dist/ || dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          # **只留 1 天**。这个 artifact 的唯一用途是交给下面的 release job 拼
          # Release 资产，几分钟就下走了。原先写 30 天，每次发版堆 1.07 GB，
          # 攒到 161 个 / 35.7 GB 之后把账户的 artifact 配额打爆 ——
          # 所有平台都卡在 upload-artifact 这一步，报
          # "Artifact storage quota has been hit"，整个 Release 被跳过。
          # 真包在 Release 里，不靠 artifact 长期留存。
          retention-days: 1

  release:
    name: 发布 Release
    needs: build
    # **不要求三个平台全绿**。2026-11-16 实测：同一份代码、同一个 tag，macOS 的
    # 自检会**概率性**死在「构建主窗口（端到端）」（arm64 与 x64 轮流挂，换个
    # tag 又都能过）—— 这是内存越界类的非确定性崩溃，不是版本问题，短时间修不掉。
    # 而 `needs: build` 默认要求所有矩阵 job 成功，结果是一两个平台的偶发崩溃
    # 把**三个平台的包全扣住**，连续 7 轮 Release 被 skip。
    # 能出几个平台的包就发几个：Windows 是主力平台，不该被 macOS 的偶发崩溃拖住。
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
        # 挂了的那一两个平台没有 artifact，不能让这里把发版也带下去
        continue-on-error: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          # 自动按提交生成 release notes。别同时写 `body` —— 两者一起给时
          # softprops 会用 body 顶掉自动生成的内容，反而丢了这一版的变更清单。
          generate_release_notes: true
          # 某个平台没上传成功时，files 匹配不到不要紧，别让发版再挂一次
          fail_on_unmatched_files: false
